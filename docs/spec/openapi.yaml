openapi: 3.0.3
info:
  title: STDS API
  version: 1.0.1
  license:
    name: Proprietary
    url: https://example.com/licenses/proprietary
  description: |
    STDS（物業代管系統）API 規格
    產出依據：docs/design/domain-model.md v3.3
    授權模型：混合型（RBAC + Resource-based）
    - x-required-role：列出可呼叫的角色（RBAC）
    - x-ownership-required：物業層級存取控制（resource-based），透過 Firebase ID token 內 Custom Claims 的 assigned_property_ids 驗證
    - 優先順序：先驗 RBAC role，再驗 property ownership（兩者皆須通過）

    認證機制（v3.2）：系統使用 Firebase Auth 管理使用者認證。
    - 登入流程：由前端 Firebase SDK 處理，後端不接受 email/password 登入
    - 後端驗證：每個 request 以 Firebase ID token（Bearer token）呼叫後端
    - 後端 middleware 以 Firebase Admin SDK 驗證 token，從 Custom Claims 讀取 role 與 assigned_property_ids
    - 密碼重設：`POST /users` 建立帳號後由後端向 Firebase 產生 reset link，再透過 email 寄送；admin 可透過 `POST /users/{id}/password-reset` 重寄設定密碼信
    - users table 透過 firebase_uid 與 Firebase 帳號對應

    ## Notification 機制

    通知由後端統一處理，不提供 REST endpoint：
    - RentBillsGenerated → 寄送帳單通知給租客
    - BillPaid → 寄送收款收據給租客
    - LeaseExpiringSoon → 寄送到期提醒給 organizer/staff
    - OverdueBillReminder → 寄送催收通知（最多 3 次）
    - FinancialReportSend → 寄送財報 Email

    - event 觸發：由後端訂閱 Domain Event 後寄送通知 - direct trigger：例如 `POST /users` 建立帳號後，後端直接向 Firebase 產生 password reset link 並寄出 onboarding email
    目前正式實作 channel 為 email，使用 Resend 發送；LINE channel 只保留抽象，尚未實作。前端無需呼叫任何 notification API。
servers:
  - url: /api/v1
security:
  - BearerAuth: []
paths:
  /auth/sync:
    post:
      operationId: syncAuth
      summary: 同步 Firebase 使用者至後端 DB（首次登入或 token 更新時呼叫）
      description: |
        前端以 Firebase SDK 完成登入後，帶 Firebase ID token 呼叫此 endpoint。
        後端以 firebase_uid 查詢既有 users table 記錄，並將最新 role 與 assigned_property_ids
        寫入 Firebase Custom Claims（若與 DB 不一致時更新）。
        此 endpoint 取代原本的 POST /auth/login（v2.9），登入由 Firebase SDK 處理。
      tags:
        - Identity & Access
      responses:
        '200':
          description: 同步成功，回傳使用者基本資料與 Custom Claims 資訊
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              examples:
                success:
                  summary: 同步成功
                  value:
                    id: 00000000-0000-0000-0000-000000000001
                    firebase_uid: uid_abc123xyz
                    name: 王小明
                    role: organizer
                    assigned_property_ids:
                      - 10000000-0000-0000-0000-000000000001
                      - 10000000-0000-0000-0000-000000000002
        '401':
          description: Firebase ID token 無效或已過期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_token:
                  summary: token 無效
                  value:
                    error_code: INVALID_FIREBASE_TOKEN
                    message: Invalid Firebase ID token.
        '404':
          description: 此 firebase_uid 尚未在後端建立帳號
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: 帳號尚未建立
                  value:
                    error_code: USER_NOT_FOUND
                    message: User not found.
  /users:
    get:
      operationId: listUsers
      summary: 成員列表
      description: |
        查詢工作室成員列表，可依 role 篩選。
        x-required-role：admin 可查全部；業主無權限。
      tags:
        - Identity & Access
      x-required-role:
        - admin
        - organizer
        - staff
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum:
              - admin
              - organizer
              - staff
              - owner
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: 成員列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
              examples:
                success:
                  summary: 成員列表
                  value:
                    data:
                      - id: 00000000-0000-0000-0000-000000000001
                        name: 王小明
                        email: organizer@studio.com
                        role: organizer
                      - id: 00000000-0000-0000-0000-000000000002
                        name: 李小花
                        email: staff@studio.com
                        role: staff
        '401':
          description: 未認證
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: 未提供 token
                  value:
                    error_code: UNAUTHORIZED
                    message: Unauthorized.
        '403':
          description: 權限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  summary: 業主無法查看成員列表
                  value:
                    error_code: FORBIDDEN
                    message: Forbidden.
    post:
      operationId: createUser
      summary: 建立使用者帳號
      description: |
        由後端建立 Firebase Auth email/password 帳號，並同步建立後端 DB 使用者記錄。 建立成功後，後端會向 Firebase 產生 password reset URL，並透過 Resend 寄出設定密碼信。
        - 建立工作室成員：x-required-role: admin
        - 建立業主帳號：x-required-role: admin, organizer
        注意：Firebase UID 由後端建立 Firebase Auth 使用者後自動產生，client 不需提供 `firebase_uid`； 密碼由 Firebase 管理，此 API 不接受 `password` 欄位。
      tags:
        - Identity & Access
      x-required-role:
        - admin
        - organizer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            examples:
              create_staff:
                summary: 建立員工帳號
                value:
                  email: newstaff@studio.com
                  name: 張大維
                  role: staff
              create_owner:
                summary: 建立業主帳號
                value:
                  email: owner@example.com
                  name: 陳老闆
                  role: owner
      responses:
        '201':
          description: 帳號建立成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              examples:
                success:
                  summary: 建立成功
                  value:
                    id: 00000000-0000-0000-0000-000000000003
                    firebase_uid: uid_staff_def456
                    email: newstaff@studio.com
                    name: 張大維
                    role: staff
                    created_at: '2026-04-15T10:00:00Z'
        '400':
          description: 欄位驗證錯誤
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_email:
                  summary: email 未填
                  value:
                    error_code: VALIDATION_EMAIL_REQUIRED
                    message: Email is required.
                invalid_email:
                  summary: email 格式錯誤
                  value:
                    error_code: VALIDATION_EMAIL_INVALID
                    message: Email format is invalid.
        '401':
          description: 未認證
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: 未提供 token
                  value:
                    error_code: UNAUTHORIZED
                    message: Unauthorized.
        '403':
          description: 權限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  summary: 員工無法建立成員帳號
                  value:
                    error_code: FORBIDDEN
                    message: Forbidden.
        '409':
          description: Email 已存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                email_exists:
                  summary: Email 重複
                  value:
                    error_code: EMAIL_ALREADY_EXISTS
                    message: Email already exists.
  /users/me:
    get:
      operationId: getCurrentUser
      summary: 查看自己的帳號資料
      tags:
        - Identity & Access
      x-required-role:
        - admin
        - organizer
        - staff
        - owner
      responses:
        '200':
          description: 自己的帳號資料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              examples:
                success:
                  summary: 帳號資料
                  value:
                    id: 00000000-0000-0000-0000-000000000001
                    firebase_uid: uid_abc123xyz
                    name: 王小明
                    email: organizer@studio.com
                    role: organizer
                    assigned_property_ids:
                      - 10000000-0000-0000-0000-000000000001
                      - 10000000-0000-0000-0000-000000000002
        '401':
          description: 未認證
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: 未提供 token
                  value:
                    error_code: UNAUTHORIZED
                    message: Unauthorized.
    patch:
      operationId: updateCurrentUser
      summary: 更新自己的帳號資料
      tags:
        - Identity & Access
      description: |
        僅允許更新 self-service 欄位。現階段僅支援更新自己的名稱；角色、權限與指派物業不透過此 API 修改。
      x-required-role:
        - admin
        - organizer
        - staff
        - owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCurrentUserRequest'
            examples:
              update_name:
                summary: 更新自己的名稱
                value:
                  name: 王大明
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              examples:
                success:
                  value:
                    id: 00000000-0000-0000-0000-000000000001
                    firebase_uid: uid_abc123xyz
                    name: 王大明
                    email: organizer@studio.com
                    role: organizer
                    assigned_property_ids:
                      - 10000000-0000-0000-0000-000000000001
        '400':
          description: 請求格式錯誤或欄位驗證失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                bad_request:
                  value:
                    error_code: VALIDATION_NAME_REQUIRED
                    message: Name is required.
        '401':
          description: 未認證
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  value:
                    error_code: UNAUTHORIZED
                    message: Unauthorized.
        '404':
          description: 使用者不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  value:
                    error_code: USER_NOT_FOUND
                    message: User not found.
  /users/{id}:
    get:
      operationId: getUser
      summary: 成員詳情
      tags:
        - Identity & Access
      x-required-role:
        - admin
        - organizer
        - staff
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成員詳情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              examples:
                success:
                  summary: 成員詳情
                  value:
                    id: 00000000-0000-0000-0000-000000000001
                    firebase_uid: uid_abc123xyz
                    name: 王小明
                    email: organizer@studio.com
                    role: organizer
                    assigned_property_ids:
                      - 10000000-0000-0000-0000-000000000001
                      - 10000000-0000-0000-0000-000000000002
        '401':
          description: 未認證
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  value:
                    error_code: UNAUTHORIZED
                    message: Unauthorized.
        '403':
          description: 權限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  value:
                    error_code: FORBIDDEN
                    message: Forbidden.
        '404':
          description: 使用者不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  value:
                    error_code: USER_NOT_FOUND
                    message: User not found.
    patch:
      operationId: updateUser
      summary: 更新使用者帳號（管理用途）
      tags:
        - Identity & Access
      x-required-role:
        - admin
      description: |
        - 角色調整：x-required-role: admin
        - 一般使用者更新自己的名稱：請使用 `PATCH /users/me`
        - 物業指派：請使用 `POST /users/{id}/property-assignments`
        - 重寄設定密碼信：請使用 `POST /users/{id}/password-reset`
        - BR-13：系統管理員不得降低自己的角色
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            examples:
              change_role:
                summary: 變更角色
                value:
                  role: organizer
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              examples:
                success:
                  value:
                    id: 00000000-0000-0000-0000-000000000001
                    role: organizer
                    updated_at: '2026-04-15T11:00:00Z'
        '401':
          description: 未認證
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  value:
                    error_code: UNAUTHORIZED
                    message: Unauthorized.
        '403':
          description: 權限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  value:
                    error_code: FORBIDDEN
                    message: Forbidden.
        '404':
          description: 使用者不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  value:
                    error_code: USER_NOT_FOUND
                    message: User not found.
        '422':
          description: Business Rule 拒絕
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                admin_cannot_downgrade_self:
                  summary: BR-13 系統管理員不得降低自己的角色
                  value:
                    error_code: ADMIN_CANNOT_DOWNGRADE_SELF
                    message: Admin cannot downgrade own role.
  /users/{id}/property-assignments:
    post:
      operationId: assignUserProperties
      summary: 指派物業給成員（觸發 PropertyUnassigned/PropertyAssigned 邏輯）
      description: |
        將物業指派給工作室成員。
        BR-11：指派對象必須為工作室成員（非業主）。
        x-required-role: admin
        指派成功後，後端呼叫 Firebase Admin SDK 更新該使用者的 Custom Claims（role 與 assigned_property_ids），
        前端下次 refresh token 後新指派生效。
      tags:
        - Identity & Access
      x-required-role:
        - admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyAssignmentRequest'
            examples:
              assign:
                summary: 指派物業
                value:
                  property_ids:
                    - 10000000-0000-0000-0000-000000000001
                    - 10000000-0000-0000-0000-000000000002
      responses:
        '200':
          description: 指派成功（Firebase Custom Claims 已更新）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              examples:
                success:
                  value:
                    id: 00000000-0000-0000-0000-000000000002
                    assigned_property_ids:
                      - 10000000-0000-0000-0000-000000000001
                      - 10000000-0000-0000-0000-000000000002
        '401':
          description: 未認證
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  value:
                    error_code: UNAUTHORIZED
                    message: Unauthorized.
        '403':
          description: 權限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  value:
                    error_code: FORBIDDEN
                    message: Forbidden.
        '404':
          description: 使用者或物業不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                user_not_found:
                  value:
                    error_code: USER_NOT_FOUND
                    message: User not found.
        '422':
          description: Business Rule 拒絕
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cannot_assign_to_owner:
                  summary: BR-11 指派對象必須為工作室成員
                  value:
                    error_code: CANNOT_ASSIGN_PROPERTY_TO_OWNER
                    message: Property assignment target must be a studio member, not an owner.
  /users/{id}/password-reset:
    post:
      operationId: triggerUserPasswordReset
      summary: 重寄使用者設定密碼信
      description: |
        由系統管理員為既有使用者重新產生 Firebase password reset link，並透過既有通知流程寄送設定密碼信。

        此 API 僅供管理用途，不修改使用者角色、名稱或其他資料。
      tags:
        - Identity & Access
      x-required-role:
        - admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 已成功寄出設定密碼信
        '401':
          description: 未認證
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  value:
                    error_code: UNAUTHORIZED
                    message: Unauthorized.
        '403':
          description: 權限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  value:
                    error_code: FORBIDDEN
                    message: Forbidden.
        '404':
          description: 使用者不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  value:
                    error_code: USER_NOT_FOUND
                    message: User not found.
  /properties:
    get:
      operationId: listProperties
      summary: 物業列表（含房間數、出租率）
      description: |
        x-ownership-required: 依角色過濾：
        - admin：全部物業
        - organizer/staff：Firebase Custom Claims 內 assigned_property_ids
        - owner：自己名下（properties.owner_id = authenticated user id）
      tags:
        - Property
      x-required-role:
        - admin
        - organizer
        - staff
        - owner
      x-ownership-required: true
      responses:
        '200':
          description: 物業列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyListResponse'
              examples:
                success:
                  value:
                    data:
                      - id: 10000000-0000-0000-0000-000000000001
                        name: 台北大安物業
                        address: 台北市大安區復興南路一段100號
                        electricity_unit_price: 4.5
                        default_electricity_billing_cadence: monthly
        '401':
          description: 未認證
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  value:
                    error_code: UNAUTHORIZED
                    message: Unauthorized.
    post:
      operationId: createProperty
      summary: 建立物業（觸發 PropertyCreated event）
      description: |
        x-required-role: admin, organizer, staff
        觸發 PropertyCreated event → Billing BC 建立 PropertyAccount
        electricity_unit_price 接受大於 0 的台幣數值，可接受小數（例如 4.5）
        default_electricity_billing_cadence 決定之後新建 Lease 的預設電費計費週期
      tags:
        - Property
      x-required-role:
        - admin
        - organizer
        - staff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePropertyRequest'
            examples:
              default:
                summary: 建立物業
                value:
                  name: 台北大安物業
                  address: 台北市大安區復興南路一段100號
                  electricity_unit_price: 4.5
                  default_electricity_billing_cadence: monthly
                  owner_id: 00000000-0000-0000-0000-000000000010
      responses:
        '201':
          description: 物業建立成功（PropertyCreated event 已發出）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyResponse'
              examples:
                success:
                  value:
                    id: 10000000-0000-0000-0000-000000000001
                    name: 台北大安物業
                    address: 台北市大安區復興南路一段100號
                    electricity_unit_price: 4.5
                    default_electricity_billing_cadence: monthly
                    owner_id: 00000000-0000-0000-0000-000000000010
                    created_at: '2026-04-15T10:00:00Z'
        '400':
          description: 欄位驗證錯誤
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_name:
                  value:
                    error_code: VALIDATION_NAME_REQUIRED
                    message: Name is required.
                invalid_electricity_price:
                  value:
                    error_code: VALIDATION_ELECTRICITY_PRICE_INVALID
                    message: Electricity unit price is invalid.
        '401':
          description: 未認證
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  value:
                    error_code: UNAUTHORIZED
                    message: Unauthorized.
        '403':
          description: 權限不足
          content:
