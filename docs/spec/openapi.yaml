  /attachments/upload-url:
    post:
      operationId: createAttachmentUploadURL
      summary: 產生附件上傳 Signed URL
      description: |
        x-required-role: admin, organizer, staff
        Step 1：後端驗證呼叫者對資源的寫入權限，建立 nonce 與 object_path，回傳 GCS Signed URL。
        BR-18：僅允許 image/jpeg、image/png、image/heic、application/pdf，單檔上限 20MB。
        注意：取得 upload_url 不代表附件已生效，必須完成 Step 3 登記。
      tags:
        - Attachments
      x-required-role:
        - admin
        - organizer
        - staff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentUploadURLRequest'
            examples:
              property_photo:
                value:
                  resource_type: property
                  resource_id: 10000000-0000-0000-0000-000000000001
                  file_name: front-door.jpg
                  content_type: image/jpeg
      responses:
        '200':
          description: Signed URL 建立成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentUploadURLResponse'
              examples:
                success:
                  value:
                    upload_url: https://storage.googleapis.com/example-bucket/attachments/properties/10000000-0000-0000-0000-000000000001/abcd.jpg?signature=masked
                    nonce: upload_nonce_123
                    expires_at: '2026-04-17T10:15:00Z'
        '400':
          description: 欄位驗證錯誤
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認證
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 權限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 目標資源不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Business Rule 拒絕
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unsupported_mime:
                  summary: BR-18 不支援的 MIME type
                  value:
                    error_code: ATTACHMENT_CONTENT_TYPE_NOT_ALLOWED
                    message: 不支援的附件 MIME type
  /attachments/{id}:
    delete:
      operationId: deleteAttachment
      summary: 軟刪除附件
      description: |
        依附件 id 軟刪除附件記錄。後續由排程任務清理 GCS 物件並硬刪除 DB 記錄。
      tags:
        - Attachments
      x-required-role:
        - admin
        - organizer
        - staff
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 刪除成功
        '401':
          description: 未認證
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 權限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 附件不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  value:
                    error_code: ATTACHMENT_NOT_FOUND
                    message: Attachment not found.
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Firebase ID token。前端以 Firebase SDK 登入後取得，每個 request 帶入 Authorization header。
        後端以 Firebase Admin SDK 驗證，Custom Claims 包含 role 與 assigned_property_ids。
    SchedulerKey:
      type: apiKey
      in: header
      name: X-Scheduler-Key
      description: |
        外部排程系統呼叫 backend job endpoint 時使用的共享密鑰。
  schemas:
    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firebase_uid:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum:
            - admin
            - organizer
            - staff
            - owner
        permission_overrides:
          type: array
          items:
            type: object
        assigned_property_ids:
          type: array
          items:
            type: string
            format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
    ErrorResponse:
      type: object
      properties:
        error_code:
          type: string
        message:
          type: string
        details:
          type: object
          nullable: true
    UserListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
    CreateUserRequest:
      type: object
      required:
        - email
        - name
        - role
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum:
            - admin
            - organizer
            - staff
            - owner
    UpdateCurrentUserRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: 顯示名稱
          maxLength: 100
    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
          enum:
            - admin
            - organizer
            - staff
            - owner
    PropertyAssignmentRequest:
      type: object
      required:
        - property_ids
      properties:
        property_ids:
          type: array
          items:
            type: string
            format: uuid
    PropertyResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
        subtitle:
          type: string
          nullable: true
        electricity_unit_price:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          description: 台幣正數/度，可接受小數
          nullable: true
        default_electricity_billing_cadence:
          type: string
          enum:
            - monthly
            - bimonthly
        owner_id:
          type: string
          format: uuid
        contact_phone:
          type: string
          nullable: true
        contact_email:
          type: string
          format: email
          nullable: true
        notes:
          type: string
          nullable: true
        facilities:
          type: array
          items: {}
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
    PropertyListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PropertyResponse'
    CreatePropertyRequest:
      type: object
      required:
        - name
        - address
        - electricity_unit_price
        - default_electricity_billing_cadence
        - owner_id
      properties:
        name:
          type: string
        address:
          type: string
        electricity_unit_price:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          description: 台幣正數/度，可接受小數（例如 4.5）
        default_electricity_billing_cadence:
          type: string
          enum:
            - monthly
            - bimonthly
          description: 物業預設電費計費 cadence，僅影響新建 Lease
        owner_id:
          type: string
          format: uuid
    UpdatePropertyRequest:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        electricity_unit_price:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          description: 台幣正數/度，可接受小數（例如 4.5）
        default_electricity_billing_cadence:
          type: string
          enum:
            - monthly
            - bimonthly
          description: 僅影響之後新建的 Lease，不回頭修改既有 Lease
    AttachmentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        object_path:
          type: string
        file_name:
          type: string
        uploaded_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        sort_order:
          type: integer
          nullable: true
        photo_stage:
          type: string
          nullable: true
          enum:
            - before
            - after
            - other
    AttachmentListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentResponse'
    RegisterAttachmentRequest:
      type: object
      required:
        - nonce
        - file_name
      properties:
        nonce:
          type: string
        file_name:
          type: string
    RoomResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        property_id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum:
            - vacant
            - occupied
            - maintenance
        size:
          type: number
          format: double
          nullable: true
        floor:
          type: string
          nullable: true
        room_type:
          type: string
          nullable: true
        facilities:
          type: object
          additionalProperties: true
          nullable: true
        default_rent_amount:
          type: integer
          nullable: true
        notes:
          type: string
          nullable: true
        zone:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RoomListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RoomResponse'
    CreateRoomRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    UpdateRoomRequest:
      type: object
      properties:
        name:
          type: string
    SetMaintenanceRequest:
      type: object
      required:
        - title
        - description
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
    RepairRequestResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        property_id:
          type: string
          format: uuid
        room_id:
          type: string
          format: uuid
        submitted_by:
          type: string
          format: uuid
        assigned_to:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
            - submitted
            - assigned
            - in_progress
            - completed
            - cancelled
        submitted_at:
          type: string
          format: date-time
        assigned_at:
          type: string
          format: date-time
          nullable: true
