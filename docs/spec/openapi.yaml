components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Firebase ID token。前端以 Firebase SDK 登入後取得，每個 request 帶入 Authorization header。
        後端以 Firebase Admin SDK 驗證，Custom Claims 包含 role 與 assigned_property_ids。
    SchedulerKey:
      type: apiKey
      in: header
      name: X-Scheduler-Key
      description: |
        外部排程系統呼叫 backend job endpoint 時使用的共享密鑰。
  schemas:
    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firebase_uid:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum:
            - admin
            - organizer
            - staff
            - owner
        permission_overrides:
          type: array
          items:
            type: object
        assigned_property_ids:
          type: array
          items:
            type: string
            format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
    ErrorResponse:
      type: object
      properties:
        error_code:
          type: string
        message:
          type: string
        details:
          type: object
          nullable: true
    UserListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
    CreateUserRequest:
      type: object
      required:
        - email
        - name
        - role
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum:
            - admin
            - organizer
            - staff
            - owner
    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
          enum:
            - admin
            - organizer
            - staff
            - owner
    PropertyAssignmentRequest:
      type: object
      required:
        - property_ids
      properties:
        property_ids:
          type: array
          items:
            type: string
            format: uuid
    PropertyResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
        electricity_unit_price:
          type: integer
        owner_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
    PropertyListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PropertyResponse'
    CreatePropertyRequest:
      type: object
      required:
        - name
        - address
        - electricity_unit_price
        - owner_id
      properties:
        name:
          type: string
        address:
          type: string
        electricity_unit_price:
          type: integer
        owner_id:
          type: string
          format: uuid
    UpdatePropertyRequest:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        electricity_unit_price:
          type: integer
    RoomResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        property_id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum:
            - vacant
            - occupied
            - maintenance
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RoomListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RoomResponse'
    CreateRoomRequest:
      type: object
      required:
        - name
