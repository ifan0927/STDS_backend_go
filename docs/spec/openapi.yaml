  /bills/{id}/meter:
    post:
      operationId: submitBillMeter
      summary: 電表抄錄（觸發 MeterRecorded event）
      description: |
        x-required-role: admin, organizer, staff
        BR-06：電表度數不得小於上月度數
        BR-16：金額由系統計算（usage × unitPrice），並四捨五入為整數 amount，不由員工輸入
        MeterRecorded event → 帳單金額更新，狀態從 pending_meter 改為 pending_payment
        抄表是針對 bill 所代表的 billing period，而不是固定自然月
        僅 electricity 且 pending_meter 狀態的帳單可抄表。
      tags:
        - Billing
      x-required-role:
        - admin
        - organizer
        - staff
      x-ownership-required: true
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordMeterRequest'
            examples:
              default:
                value:
                  current_reading: 1380
      responses:
        '200':
          description: 電表抄錄成功（MeterRecorded event 已發出，帳單金額已更新）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillResponse'
              examples:
                success:
                  value:
                    id: 50000000-0000-0000-0000-000000000002
                    status: pending_payment
                    period_start: '2026-05-01'
                    period_end: '2026-06-30'
                    meter_previous_reading: 1250
                    meter_current_reading: 1380
                    meter_unit_price: 4.5
                    amount: 585
                    meter_recorded_at: '2026-04-15T10:00:00Z'
        '400':
          description: 欄位驗證錯誤
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_reading:
                  value:
                    error_code: VALIDATION_CURRENT_READING_REQUIRED
                    message: current_reading 為必填欄位
        '401':
          description: 未認證
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  value:
                    error_code: UNAUTHORIZED
                    message: Unauthorized.
        '403':
          description: 權限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  value:
                    error_code: FORBIDDEN
                    message: Forbidden.
        '404':
          description: 帳單不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  value:
                    error_code: BILL_NOT_FOUND
                    message: Bill not found.
        '409':
          description: 樂觀鎖衝突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                conflict:
                  value:
                    error_code: CONCURRENT_UPDATE_CONFLICT
                    message: 資料已被其他操作更新，請重試
        '422':
          description: Business Rule 拒絕
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                reading_less_than_previous:
                  summary: BR-06 電表度數不得小於上月
                  value:
                    error_code: METER_READING_LESS_THAN_PREVIOUS
                    message: 電表度數不得小於上月度數
                    details:
                      previous_reading: 1250
                      submitted_reading: 1200
                wrong_bill_type:
                  summary: 非電費帳單無法抄錄
                  value:
                    error_code: BILL_NOT_ELECTRICITY_TYPE
                    message: 此帳單非電費帳單，無法執行抄錄
                status_not_recordable:
                  summary: 帳單狀態不可抄表
                  value:
                    error_code: BILL_STATUS_NOT_RECORDABLE
                    message: Bill status is not recordable.
  /bills/{id}/payment:
    post:
      operationId: recordBillPayment
      summary: 收款確認（觸發 BillPaid event）
      description: |
        x-required-role: admin, organizer, staff
        BR-05：帳單不得重複收款（已 paid 狀態拒絕）
        paid_amount 必須等於帳單 amount；不支援部分收款或溢收。
        僅 pending_payment / overdue 狀態可收款，允許 overdue → paid 轉換。
        觸發 BillPaid event → PropertyAccount 新增 AccountingEntry
      tags:
        - Billing
      x-required-role:
        - admin
        - organizer
        - staff
      x-ownership-required: true
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordPaymentRequest'
            examples:
              default:
                value:
                  payment_method: transfer
                  paid_amount: 18000
      responses:
        '200':
          description: 收款確認成功（BillPaid event 已發出）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillResponse'
              examples:
                success:
                  value:
                    id: 50000000-0000-0000-0000-000000000001
                    status: paid
                    payment_method: transfer
                    paid_amount: 18000
                    paid_at: '2026-04-15T10:30:00Z'
        '400':
          description: 欄位驗證錯誤
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_amount:
                  value:
                    error_code: VALIDATION_PAID_AMOUNT_REQUIRED
                    message: paid_amount 為必填欄位
        '401':
          description: 未認證
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  value:
                    error_code: UNAUTHORIZED
                    message: Unauthorized.
        '403':
          description: 權限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  value:
                    error_code: FORBIDDEN
                    message: Forbidden.
        '404':
          description: 帳單不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  value:
                    error_code: BILL_NOT_FOUND
                    message: Bill not found.
        '409':
          description: 樂觀鎖衝突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                conflict:
                  value:
                    error_code: CONCURRENT_UPDATE_CONFLICT
                    message: 資料已被其他操作更新，請重試
        '422':
          description: Business Rule 拒絕
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                already_paid:
                  summary: BR-05 帳單已收款不得重複
                  value:
                    error_code: BILL_ALREADY_PAID
                    message: 此帳單已完成收款，不得重複收款
                status_not_payable:
                  summary: 帳單狀態不可收款
                  value:
                    error_code: BILL_STATUS_NOT_PAYABLE
                    message: Bill status is not payable.
                amount_mismatch:
                  summary: 收款金額必須等於帳單金額
                  value:
                    error_code: BILL_PAID_AMOUNT_MISMATCH
                    message: Paid amount must equal bill amount.
                    details:
                      expected_amount: 18000
                      submitted_amount: 17000
