    post:
      operationId: forceTerminateLease
      summary: 強制終止租約（觸發 LeaseTerminated event，forced=true）
      description: |
        x-required-role: admin, organizer（BR-14：主辦以上）
        流程：ForceTermination 記錄 → 未結清帳單同步標記 written_off → ForceTermination 標記 completed → LeaseTerminated（forced: true）
        觸發 LeaseTerminated（forced: true）→ Property BC（Room 改 vacant）+ Notification BC（寄強制終止通知）
        BR-14：需主辦以上角色並填寫原因。
      tags:
        - Leasing
      x-required-role:
        - admin
        - organizer
      x-ownership-required: true
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForceTerminateRequest'
            examples:
              default:
                value:
                  reason: 租客失聯，連續 3 個月未繳租金
                  deposit_handling: write_off
      responses:
        '200':
          description: 強制終止完成（force_termination 記錄已建立，未結清帳單已同步 written_off）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForceTerminationResponse'
              examples:
                completed:
                  value:
                    id: 80000000-0000-0000-0000-000000000001
                    lease_id: 40000000-0000-0000-0000-000000000003
                    status: completed
                    deposit_handling: write_off
                    bills:
                      - bill_id: 50000000-0000-0000-0000-000000000010
                        status: done
                    created_at: '2026-04-15T17:00:00Z'
        '400':
          description: 請求格式錯誤（例如不支援的 deposit_handling）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_deposit_handling:
                  summary: 不支援的押金處理方式
                  value:
                    error_code: BAD_REQUEST
                    message: Bad request.
                    details:
                      field: deposit_handling
        '401':
          description: 未認證
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  value:
                    error_code: UNAUTHORIZED
                    message: Unauthorized.
        '403':
          description: 員工角色無法執行強制終止（BR-14）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  summary: BR-14 員工不可強制終止
                  value:
                    error_code: FORBIDDEN_FORCE_TERMINATION
                    message: Force termination requires organizer or admin role.
        '404':
          description: 租約不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  value:
                    error_code: LEASE_NOT_FOUND
                    message: Lease not found.
        '422':
          description: Business Rule 拒絕
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                reason_required:
                  summary: BR-14 必須填寫強制終止原因
                  value:
                    error_code: FORCE_TERMINATION_REASON_REQUIRED
                    message: Force termination reason is required.
                deposit_handling_required:
                  summary: 強制終止必須指定押金處理方式
                  value:
                    error_code: FORCE_TERMINATION_DEPOSIT_HANDLING_REQUIRED
                    message: Deposit handling is required for force termination.
