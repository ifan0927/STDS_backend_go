          type: string
    UpdateRoomRequest:
      type: object
      properties:
        name:
          type: string
    SetMaintenanceRequest:
      type: object
      properties:
        reason:
          type: string
    DashboardRoomItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
