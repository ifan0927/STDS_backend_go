get:
  operationId: listRepairRequests
  summary: 維修列表
  description: 'x-ownership-required: organizer/staff 查詢指派物業'
  tags:
    - Journal
  x-required-role:
    - admin
    - organizer
    - staff
  x-ownership-required: true
  parameters:
    - name: property_id
      in: query
      schema:
        type: string
    - name: room_id
      in: query
      schema:
        type: string
    - name: status
      in: query
      schema:
        type: string
        enum:
          - submitted
          - assigned
          - in_progress
          - completed
          - cancelled
    - name: assigned_to
      in: query
      description: 依指派對象篩選（user_id）；staff 帶自己的 id，organizer 可帶任意 staff id
      schema:
        type: string
    - name: page
      in: query
      schema:
        type: integer
        default: 1
    - name: limit
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
  responses:
    '200':
      description: 維修列表
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/repair/RepairRequestListResponse.yaml
          examples:
            success:
              value:
                data:
                  - id: 70000000-0000-0000-0000-000000000001
                    property_id: 10000000-0000-0000-0000-000000000001
                    room_id: 20000000-0000-0000-0000-000000000002
                    title: 浴室漏水
                    status: in_progress
                    assigned_to: 00000000-0000-0000-0000-000000000002
    '401':
      description: 未認證
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            unauthorized:
              value:
                error_code: UNAUTHORIZED
                message: Unauthorized.
post:
  operationId: createRepairRequest
  summary: 建立維修請求
  description: 'x-required-role: admin, organizer, staff'
  tags:
    - Journal
  x-required-role:
    - admin
    - organizer
    - staff
  x-ownership-required: true
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/repair/CreateRepairRequestRequest.yaml
        examples:
          default:
            value:
              property_id: 10000000-0000-0000-0000-000000000001
              room_id: 20000000-0000-0000-0000-000000000002
              title: 浴室漏水
              description: 浴室天花板持續漏水，疑似上層住戶水管問題
  responses:
    '201':
      description: 維修請求建立成功
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/repair/RepairRequestResponse.yaml
          examples:
            success:
              value:
                id: 70000000-0000-0000-0000-000000000002
                property_id: 10000000-0000-0000-0000-000000000001
                room_id: 20000000-0000-0000-0000-000000000002
                title: 浴室漏水
                status: submitted
                submitted_at: '2026-04-15T10:00:00Z'
    '400':
      description: 欄位驗證錯誤
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            missing_title:
              value:
                error_code: VALIDATION_REPAIR_TITLE_REQUIRED
                message: 維修標題為必填欄位
    '401':
      description: 未認證
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            unauthorized:
              value:
                error_code: UNAUTHORIZED
                message: Unauthorized.
    '403':
      description: 權限不足
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            forbidden:
              value:
                error_code: FORBIDDEN
                message: Forbidden.
