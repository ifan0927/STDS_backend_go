get:
  operationId: listRepairRequestAttachments
  summary: 維修單附件列表
  description: 依 sort_order 升冪排序回傳。
  tags:
    - Journal
  x-required-role:
    - admin
    - organizer
    - staff
  x-ownership-required: true
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: 維修單附件列表
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/AttachmentListResponse.yaml
    '401':
      description: 未認證
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
    '403':
      description: 權限不足
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
    '404':
      description: 維修單不存在
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
post:
  operationId: createRepairRequestAttachment
  summary: 登記維修單附件
  description: |
    x-required-role: admin, organizer, staff
    repair_request_attachments 額外支援 sort_order 與 photo_stage。
  tags:
    - Journal
  x-required-role:
    - admin
    - organizer
    - staff
  x-ownership-required: true
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/shared/RegisterRepairRequestAttachmentRequest.yaml
        examples:
          before_photo:
            value:
              nonce: upload_nonce_123
              file_name: bathroom-before.jpg
              sort_order: 1
              photo_stage: before
  responses:
    '201':
      description: 維修單附件建立成功
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/AttachmentResponse.yaml
    '401':
      description: 未認證
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
    '403':
      description: 權限不足
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
    '404':
      description: 維修單不存在
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
    '422':
      description: Business Rule 拒絕
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
