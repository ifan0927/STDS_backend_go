get:
  operationId: listPropertyMeterHistory
  summary: 某物業全房間電表歷史（按月呈現）
  tags:
    - Billing
  x-required-role:
    - admin
    - organizer
    - staff
  x-ownership-required: true
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    - name: year
      in: query
      schema:
        type: integer
        example: 2026
  responses:
    '200':
      description: 電表歷史
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/billing/PropertyMeterHistoryResponse.yaml
          examples:
            success:
              value:
                data:
                  - bill_id: 50000000-0000-0000-0000-000000000002
                    property_id: 10000000-0000-0000-0000-000000000001
                    room_id: 20000000-0000-0000-0000-000000000002
                    room_label: '101'
                    tenant_id: 30000000-0000-0000-0000-000000000002
                    tenant_label: 王小明
                    lease_id: 40000000-0000-0000-0000-000000000002
                    period_start: '2026-04-01'
                    period_end: '2026-04-30'
                    period_label: 2026-04-01..2026-04-30
                    due_date: '2026-04-01'
                    previous_reading: 1120
                    current_reading: 1250
                    usage: 130
                    unit_price: 5
                    amount: 650
                    status: paid
                    meter_recorded_at: '2026-04-24T10:00:00Z'
    '401':
      description: 未認證
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            unauthorized:
              value:
                error_code: UNAUTHORIZED
                message: Unauthorized.
    '404':
      description: 物業不存在
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            not_found:
              value:
                error_code: PROPERTY_NOT_FOUND
                message: Property not found.
