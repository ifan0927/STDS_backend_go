post:
  operationId: sendPropertyFinancialReport
  summary: 財報審核後寄送給業主
  description: |
    x-required-role: admin, organizer（財報審核與寄送）
    人工操作，觸發財報 Email 寄送給業主。
  tags:
    - Billing
  x-required-role:
    - admin
    - organizer
  x-ownership-required: true
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    - name: year
      in: path
      required: true
      schema:
        type: integer
    - name: month
      in: path
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: 財報已寄送
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/billing/FinancialReportResponse.yaml
          examples:
            success:
              value:
                property_id: 10000000-0000-0000-0000-000000000001
                year: 2026
                month: 3
    '401':
      description: 未認證
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            unauthorized:
              value:
                error_code: UNAUTHORIZED
                message: 請先登入
    '403':
      description: 員工無法執行財報寄送
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            forbidden:
              value:
                error_code: FORBIDDEN
                message: 財報審核與寄送需要主辦以上角色
    '404':
      description: 財報不存在
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            not_found:
              value:
                error_code: FINANCIAL_REPORT_NOT_FOUND
                message: 該月份財報不存在
