get:
  operationId: getBill
  summary: 帳單詳情（電費帳單自動帶入 previousReading）
  description: >
    電費帳單回傳時，系統自動查詢同 room_id 最近一張屬於上一個已完成 billing period 且有
    meter_reading 的電費帳單的 currentReading 作為 previousReading。response 並帶
    period_start / period_end。
  tags:
    - Billing
  x-required-role:
    - admin
    - organizer
    - staff
    - owner
  x-ownership-required: true
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: 帳單詳情
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/billing/BillResponse.yaml
          examples:
            rent_bill:
              summary: 租金帳單
              value:
                id: 50000000-0000-0000-0000-000000000001
                type: rent
                amount: 18000
                period_start: '2026-05-01'
                period_end: '2026-05-31'
                due_date: '2026-05-01'
                status: pending_payment
            electricity_bill_pending_meter:
              summary: 電費帳單（待抄表，帶入 previousReading）
              value:
                id: 50000000-0000-0000-0000-000000000002
                type: electricity
                amount: null
                period_start: '2026-05-01'
                period_end: '2026-05-31'
                due_date: '2026-05-01'
                status: pending_meter
                meter_previous_reading: 1250
                meter_current_reading: null
                meter_unit_price: 4.5
    '401':
      description: 未認證
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            unauthorized:
              value:
                error_code: UNAUTHORIZED
                message: Unauthorized.
    '403':
      description: 無存取權限
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            forbidden:
              value:
                error_code: FORBIDDEN
                message: Forbidden.
    '404':
      description: 帳單不存在
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            not_found:
              value:
                error_code: BILL_NOT_FOUND
                message: Bill not found.
