get:
  operationId: getJournalLog
  summary: 日誌詳情
  tags:
    - Journal
  x-required-role:
    - admin
    - organizer
    - staff
  x-ownership-required: true
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: 日誌詳情
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/journal/JournalLogResponse.yaml
          examples:
            success:
              value:
                id: 60000000-0000-0000-0000-000000000001
                property_id: 10000000-0000-0000-0000-000000000001
                room_id: null
                author_id: 00000000-0000-0000-0000-000000000002
                content: 更換大廳燈泡
                expense_amount: null
                expense_description: null
                created_at: '2026-04-10T09:00:00Z'
    '401':
      description: 未認證
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            unauthorized:
              value:
                error_code: UNAUTHORIZED
                message: Unauthorized.
    '403':
      description: 無存取權限
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            forbidden:
              value:
                error_code: FORBIDDEN
                message: Forbidden.
    '404':
      description: 日誌不存在
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            not_found:
              value:
                error_code: JOURNAL_LOG_NOT_FOUND
                message: Journal log not found.
patch:
  operationId: updateJournalLog
  summary: 編輯日誌
  description: 'x-required-role: admin, organizer, staff'
  tags:
    - Journal
  x-required-role:
    - admin
    - organizer
    - staff
  x-ownership-required: true
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/journal/UpdateJournalLogRequest.yaml
        examples:
          default:
            value:
              content: 浴室漏水修繕（已完成）
              expense_accounting_title_id: 70000000-0000-0000-0000-000000000001
  responses:
    '200':
      description: 更新成功
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/journal/JournalLogResponse.yaml
          examples:
            success:
              value:
                id: 60000000-0000-0000-0000-000000000001
                content: 浴室漏水修繕（已完成）
                expense_accounting_title_code: '6681'
                expense_accounting_title_name: 其他支出
                updated_at: '2026-04-15T15:00:00Z'
    '401':
      description: 未認證
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            unauthorized:
              value:
                error_code: UNAUTHORIZED
                message: Unauthorized.
    '403':
      description: 權限不足
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            forbidden:
              value:
                error_code: FORBIDDEN
                message: Forbidden.
    '404':
      description: 日誌不存在
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            not_found:
              value:
                error_code: JOURNAL_LOG_NOT_FOUND
                message: Journal log not found.
    '409':
      description: 日誌費用所屬月份已月結，不能改變會計影響
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            snapshot_finalized:
              value:
                error_code: JOURNAL_EXPENSE_SNAPSHOT_FINALIZED
                message: Journal expense belongs to a finalized monthly snapshot.
delete:
  operationId: deleteJournalLog
  summary: 刪除日誌（軟刪除）
  description: 'x-required-role: admin, organizer'
  tags:
    - Journal
  x-required-role:
    - admin
    - organizer
  x-ownership-required: true
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '204':
      description: 刪除成功
    '401':
      description: 未認證
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            unauthorized:
              value:
                error_code: UNAUTHORIZED
                message: Unauthorized.
    '403':
      description: 員工無法刪除日誌
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            forbidden:
              value:
                error_code: FORBIDDEN
                message: Forbidden.
    '404':
      description: 日誌不存在
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            not_found:
              value:
                error_code: JOURNAL_LOG_NOT_FOUND
                message: Journal log not found.
    '409':
      description: 日誌費用所屬月份已月結，不能刪除會計影響
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            snapshot_finalized:
              value:
                error_code: JOURNAL_EXPENSE_SNAPSHOT_FINALIZED
                message: Journal expense belongs to a finalized monthly snapshot.
