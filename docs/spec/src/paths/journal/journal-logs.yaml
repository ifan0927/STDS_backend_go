get:
  operationId: listJournalLogs
  summary: 日誌列表
  description: |
    x-ownership-required: organizer/staff 查詢指派物業
  tags:
    - Journal
  x-required-role:
    - admin
    - organizer
    - staff
  x-ownership-required: true
  parameters:
    - name: property_id
      in: query
      schema:
        type: string
    - name: room_id
      in: query
      schema:
        type: string
    - name: date_from
      in: query
      schema:
        type: string
        format: date
        description: 格式：YYYY-MM-DD，對應 created_at
    - name: date_to
      in: query
      schema:
        type: string
        format: date
        description: 格式：YYYY-MM-DD，對應 created_at
    - name: page
      in: query
      schema:
        type: integer
        default: 1
    - name: limit
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
  responses:
    '200':
      description: 日誌列表
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/journal/JournalLogListResponse.yaml
          examples:
            success:
              value:
                data:
                  - id: 60000000-0000-0000-0000-000000000001
                    property_id: 10000000-0000-0000-0000-000000000001
                    room_id: null
                    content: 更換大廳燈泡
                    expense_amount: null
                    created_at: '2026-04-10T09:00:00Z'
    '401':
      description: 未認證
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            unauthorized:
              value:
                error_code: UNAUTHORIZED
                message: Unauthorized.
post:
  operationId: createJournalLog
  summary: 建立日誌並直接建立記帳分錄
  description: >
    x-required-role: admin, organizer, staff

    當提供 expense_amount 時，command transaction 會直接建立
    PropertyAccount 的 AccountingEntry。JournalExpenseRecorded 僅保留為
    trace/reserved event，不再負責建立記帳分錄。
  tags:
    - Journal
  x-required-role:
    - admin
    - organizer
    - staff
  x-ownership-required: true
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/journal/CreateJournalLogRequest.yaml
        examples:
          with_expense:
            summary: 含費用的日誌
            value:
              property_id: 10000000-0000-0000-0000-000000000001
              room_id: 20000000-0000-0000-0000-000000000001
              content: 浴室漏水修繕
              expense_amount: 3500
              expense_description: 水管更換費用
              expense_accounting_title_id: 70000000-0000-0000-0000-000000000001
          without_expense:
            summary: 一般日誌
            value:
              property_id: 10000000-0000-0000-0000-000000000001
              content: 定期巡視物業
  responses:
    '201':
      description: 日誌建立成功（有費用時 JournalExpenseRecorded event 已發出）
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/journal/JournalLogResponse.yaml
          examples:
            success:
              value:
                id: 60000000-0000-0000-0000-000000000002
                property_id: 10000000-0000-0000-0000-000000000001
                content: 浴室漏水修繕
                expense_amount: 3500
                expense_accounting_title_id: 70000000-0000-0000-0000-000000000001
                expense_accounting_title_code: '6681'
                expense_accounting_title_name: 其他支出
                created_at: '2026-04-15T11:00:00Z'
    '400':
      description: 欄位驗證錯誤
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            missing_content:
              value:
                error_code: VALIDATION_JOURNAL_CONTENT_REQUIRED
                message: 日誌內容為必填欄位
    '401':
      description: 未認證
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            unauthorized:
              value:
                error_code: UNAUTHORIZED
                message: Unauthorized.
    '403':
      description: 權限不足
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            forbidden:
              value:
                error_code: FORBIDDEN
                message: Forbidden.
    '409':
      description: 日誌費用所屬月份已月結，不能改變會計影響
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            snapshot_finalized:
              value:
                error_code: JOURNAL_EXPENSE_SNAPSHOT_FINALIZED
                message: Journal expense belongs to a finalized monthly snapshot.
