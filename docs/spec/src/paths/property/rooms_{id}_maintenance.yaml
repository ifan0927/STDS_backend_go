post:
  operationId: createRoomMaintenance
  summary: 設定房間進入維修狀態並建立維修請求（觸發 RoomSetToMaintenance event）
  description: |
    x-required-role: admin, organizer, staff
    同一 transaction 內建立 room-scoped repair request、更新 room status = maintenance，
    並於提交後觸發 RoomSetToMaintenance event。
  tags:
    - Property
  x-required-role:
    - admin
    - organizer
    - staff
  x-ownership-required: true
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/property/SetMaintenanceRequest.yaml
        examples:
          default:
            value:
              title: 浴室漏水
              description: 浴室天花板持續漏水，需安排廠商檢修
  responses:
    '200':
      description: 房間已進入維修狀態，並已建立維修請求（RoomSetToMaintenance event 已發出）
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/property/SetMaintenanceResponse.yaml
          examples:
            success:
              value:
                room:
                  id: 20000000-0000-0000-0000-000000000002
                  status: maintenance
                  updated_at: '2026-04-15T14:00:00Z'
                repair_request:
                  id: 70000000-0000-0000-0000-000000000002
                  property_id: 10000000-0000-0000-0000-000000000001
                  room_id: 20000000-0000-0000-0000-000000000002
                  submitted_by: 00000000-0000-0000-0000-000000000002
                  title: 浴室漏水
                  description: 浴室天花板持續漏水，需安排廠商檢修
                  status: submitted
                  submitted_at: '2026-04-15T14:00:00Z'
                  created_at: '2026-04-15T14:00:00Z'
                  updated_at: '2026-04-15T14:00:00Z'
    '401':
      description: 未認證
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            unauthorized:
              value:
                error_code: UNAUTHORIZED
                message: Unauthorized.
    '403':
      description: 權限不足
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            forbidden:
              value:
                error_code: FORBIDDEN
                message: Forbidden.
    '404':
      description: 房間不存在
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            not_found:
              value:
                error_code: ROOM_NOT_FOUND
                message: Room not found.
    '422':
      description: Business Rule 拒絕（房間已在維修或出租中）
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            room_already_occupied:
              summary: 出租中的房間無法設為維修
              value:
                error_code: ROOM_IS_OCCUPIED
                message: 出租中的房間無法設定維修狀態
            room_already_in_maintenance:
              summary: 維修中的房間無法重複設定維修
              value:
                error_code: ROOM_IS_IN_MAINTENANCE
                message: 維修中的房間無法設定維修狀態
