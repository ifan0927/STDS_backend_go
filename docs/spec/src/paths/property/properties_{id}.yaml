get:
  operationId: getProperty
  summary: 物業詳情
  tags:
    - Property
  x-required-role:
    - admin
    - organizer
    - staff
    - owner
  x-ownership-required: true
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: 物業詳情
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/property/PropertyResponse.yaml
          examples:
            success:
              value:
                id: 10000000-0000-0000-0000-000000000001
                name: 台北大安物業
                address: 台北市大安區復興南路一段100號
                electricity_unit_price: 4.5
                owner_id: 00000000-0000-0000-0000-000000000010
    '401':
      description: 未認證
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            unauthorized:
              value:
                error_code: UNAUTHORIZED
                message: 請先登入
    '403':
      description: 權限不足（非指派物業）
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            forbidden:
              value:
                error_code: FORBIDDEN
                message: 無此物業的存取權限
    '404':
      description: 物業不存在
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            not_found:
              value:
                error_code: PROPERTY_NOT_FOUND
                message: 物業不存在
patch:
  operationId: updateProperty
  summary: 編輯物業（含修改電價 BR-17）
  description: |
    修改電價（electricity_unit_price）：x-required-role: admin, organizer（BR-17）
    electricity_unit_price 接受大於 0 的台幣數值，可接受小數（例如 4.5）
    其他欄位編輯：x-required-role: admin, organizer, staff
  tags:
    - Property
  x-required-role:
    - admin
    - organizer
    - staff
  x-ownership-required: true
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/property/UpdatePropertyRequest.yaml
        examples:
          update_price:
            summary: 修改電價
            value:
              electricity_unit_price: 4.5
  responses:
    '200':
      description: 更新成功
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/property/PropertyResponse.yaml
          examples:
            success:
              value:
                id: 10000000-0000-0000-0000-000000000001
                electricity_unit_price: 4.5
                updated_at: '2026-04-15T12:00:00Z'
    '401':
      description: 未認證
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            unauthorized:
              value:
                error_code: UNAUTHORIZED
                message: 請先登入
    '403':
      description: 權限不足（員工不可修改電價 BR-17）
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            forbidden_electricity_price:
              summary: BR-17 員工不可修改電價
              value:
                error_code: FORBIDDEN_ELECTRICITY_PRICE_UPDATE
                message: 修改電價需要主辦以上角色
    '404':
      description: 物業不存在
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            not_found:
              value:
                error_code: PROPERTY_NOT_FOUND
                message: 物業不存在
    '422':
      description: Business Rule 拒絕
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            invalid_price:
              summary: 電價不得為零或負數
              value:
                error_code: ELECTRICITY_PRICE_MUST_BE_POSITIVE
                message: 電價必須大於 0
delete:
  operationId: deleteProperty
  summary: 刪除物業（軟刪除）
  description: |
    x-required-role: admin, organizer
    BR-07：底下有出租中房間的物業不得刪除。
  tags:
    - Property
  x-required-role:
    - admin
    - organizer
  x-ownership-required: true
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '204':
      description: 刪除成功
    '401':
      description: 未認證
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            unauthorized:
              value:
                error_code: UNAUTHORIZED
                message: 請先登入
    '403':
      description: 權限不足
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            forbidden:
              value:
                error_code: FORBIDDEN
                message: 員工無法刪除物業
    '404':
      description: 物業不存在
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            not_found:
              value:
                error_code: PROPERTY_NOT_FOUND
                message: 物業不存在
    '422':
      description: Business Rule 拒絕
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            has_occupied_rooms:
              summary: BR-07 有出租中房間不得刪除
              value:
                error_code: PROPERTY_HAS_OCCUPIED_ROOMS
                message: 物業底下有出租中的房間，無法刪除
                details:
                  occupied_room_ids:
                    - 20000000-0000-0000-0000-000000000001
                    - 20000000-0000-0000-0000-000000000003
