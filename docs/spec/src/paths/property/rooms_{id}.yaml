get:
  operationId: getRoom
  summary: 房間詳情
  tags:
    - Property
  x-required-role:
    - admin
    - organizer
    - staff
    - owner
  x-ownership-required: true
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: 房間詳情
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/property/RoomResponse.yaml
          examples:
            success:
              value:
                id: 20000000-0000-0000-0000-000000000001
                property_id: 10000000-0000-0000-0000-000000000001
                name: 101 室
                status: occupied
    '401':
      description: 未認證
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            unauthorized:
              value:
                error_code: UNAUTHORIZED
                message: Unauthorized.
    '403':
      description: 無此物業存取權限
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            forbidden:
              value:
                error_code: FORBIDDEN
                message: Forbidden.
    '404':
      description: 房間不存在
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            not_found:
              value:
                error_code: ROOM_NOT_FOUND
                message: Room not found.
patch:
  operationId: updateRoom
  summary: 編輯房間
  description: 'x-required-role: admin, organizer, staff'
  tags:
    - Property
  x-required-role:
    - admin
    - organizer
    - staff
  x-ownership-required: true
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/property/UpdateRoomRequest.yaml
        examples:
          default:
            value:
              name: 101 室（重新命名）
  responses:
    '200':
      description: 更新成功
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/property/RoomResponse.yaml
          examples:
            success:
              value:
                id: 20000000-0000-0000-0000-000000000001
                name: 101 室（重新命名）
                updated_at: '2026-04-15T12:00:00Z'
    '401':
      description: 未認證
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            unauthorized:
              value:
                error_code: UNAUTHORIZED
                message: Unauthorized.
    '403':
      description: 權限不足
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            forbidden:
              value:
                error_code: FORBIDDEN
                message: Forbidden.
    '404':
      description: 房間不存在
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            not_found:
              value:
                error_code: ROOM_NOT_FOUND
                message: Room not found.
delete:
  operationId: deleteRoom
  summary: 刪除房間（軟刪除）
  description: |
    x-required-role: admin, organizer
    BR-08：出租中或維修中的房間不得刪除。
  tags:
    - Property
  x-required-role:
    - admin
    - organizer
  x-ownership-required: true
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '204':
      description: 刪除成功
    '401':
      description: 未認證
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            unauthorized:
              value:
                error_code: UNAUTHORIZED
                message: Unauthorized.
    '403':
      description: 權限不足
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            forbidden:
              value:
                error_code: FORBIDDEN
                message: Forbidden.
    '404':
      description: 房間不存在
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            not_found:
              value:
                error_code: ROOM_NOT_FOUND
                message: Room not found.
    '422':
      description: Business Rule 拒絕
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            room_occupied:
              summary: BR-08 出租中的房間不得刪除
              value:
                error_code: ROOM_IS_OCCUPIED
                message: 出租中的房間不得刪除
            room_in_maintenance:
              summary: BR-08 維修中的房間不得刪除
              value:
                error_code: ROOM_IS_IN_MAINTENANCE
                message: 維修中的房間不得刪除
