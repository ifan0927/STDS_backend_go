get:
  operationId: getPropertyDashboard
  summary: PropertyOwnerView Dashboard（跨 BC 組合查詢）
  description: |
    房間狀態 + 本月收支 + 逾期帳單數 + 最近 5 筆 Journal。
    x-ownership-required: 依角色過濾。
  tags:
    - Property
  x-required-role:
    - admin
    - organizer
    - staff
    - owner
  x-ownership-required: true
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Dashboard 資料
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/property/DashboardResponse.yaml
          examples:
            success:
              value:
                property_id: 10000000-0000-0000-0000-000000000001
                rooms:
                  - id: 20000000-0000-0000-0000-000000000001
                    name: 101 室
                    status: occupied
                  - id: 20000000-0000-0000-0000-000000000002
                    name: 102 室
                    status: vacant
                monthly_summary:
                  expected_rent: 50000
                  collected_rent: 40000
                  overdue_bill_count: 2
                occupancy_summary:
                  total_rooms: 2
                  occupied_rooms: 1
                  vacant_rooms: 1
                  maintenance_rooms: 0
                  occupancy_rate: 0.5
                recent_journals:
                  - id: 60000000-0000-0000-0000-000000000001
                    type: journal_log
                    content: 更換大廳燈泡
                    created_at: '2026-04-10T09:00:00Z'
    '401':
      description: 未認證
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            unauthorized:
              value:
                error_code: UNAUTHORIZED
                message: Unauthorized.
    '403':
      description: 無此物業存取權限
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            forbidden:
              value:
                error_code: FORBIDDEN
                message: Forbidden.
    '404':
      description: 物業不存在
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            not_found:
              value:
                error_code: PROPERTY_NOT_FOUND
                message: Property not found.
