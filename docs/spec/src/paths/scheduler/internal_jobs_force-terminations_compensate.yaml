post:
  operationId: runForceTerminationCompensationJob
  summary: 觸發強制終止補償 job
  description: |
    由外部 scheduler 呼叫。此 endpoint 不使用 Firebase Bearer token，而是使用 `X-Scheduler-Key`。
  tags:
    - Scheduler
  security:
    - SchedulerKey: []
  parameters:
    - name: window_key
      in: query
      required: true
      schema:
        type: string
  responses:
    '202':
      description: 已接受 job 觸發請求
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/SchedulerJobTriggerResponse.yaml
          examples:
            accepted:
              value:
                job_key: force_termination_compensation
                status: accepted
                window_key: 2026-04-16
                requested_at: '2026-04-16T00:00:00Z'
                request_id: req_123
                retry_count: 0
                duration_ms: 15
                summary:
                  processed_count: 0
                  skipped_count: 0
                  failed_count: 0
                  note: job completed
    '400':
      description: 缺少 window_key
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
    '401':
      description: 缺少或提供了錯誤的 scheduler key
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
