post:
  operationId: createAttachmentUploadURL
  summary: 產生附件上傳 Signed URL
  description: |
    x-required-role: admin, organizer, staff
    Step 1：後端驗證呼叫者對資源的寫入權限，建立 nonce 與 object_path，回傳 GCS Signed URL。
    BR-18：僅允許 image/jpeg、image/png、image/heic、application/pdf，且在產生 upload URL 前驗證 file_size 不可超過 20MB。
    注意：取得 upload_url 不代表附件已生效，必須完成 Step 3 登記。
  tags:
    - Attachments
  x-required-role:
    - admin
    - organizer
    - staff
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/shared/AttachmentUploadURLRequest.yaml
        examples:
          property_photo:
            value:
              resource_type: property
              resource_id: 10000000-0000-0000-0000-000000000001
              file_name: front-door.jpg
              content_type: image/jpeg
              file_size: 1048576
  responses:
    '200':
      description: Signed URL 建立成功
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/AttachmentUploadURLResponse.yaml
          examples:
            success:
              value:
                upload_url: https://storage.googleapis.com/example-bucket/attachments/properties/10000000-0000-0000-0000-000000000001/abcd.jpg?signature=masked
                nonce: upload_nonce_123
                expires_at: '2026-04-17T10:15:00Z'
    '400':
      description: 欄位驗證錯誤
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
    '401':
      description: 未認證
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
    '403':
      description: 權限不足
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
    '404':
      description: 目標資源不存在
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
    '422':
      description: Business Rule 拒絕
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            unsupported_mime:
              summary: BR-18 不支援的 MIME type
              value:
                error_code: ATTACHMENT_CONTENT_TYPE_NOT_ALLOWED
                message: 不支援的附件 MIME type
            file_too_large:
              summary: BR-18 檔案超過 20MB
              value:
                error_code: ATTACHMENT_FILE_TOO_LARGE
                message: Attachment file size exceeds the 20MB limit.
