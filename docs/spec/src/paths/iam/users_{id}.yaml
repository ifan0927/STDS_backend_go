get:
  operationId: getUser
  summary: 成員詳情
  tags:
    - Identity & Access
  x-required-role:
    - admin
    - organizer
    - staff
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: 成員詳情
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/iam/UserResponse.yaml
          examples:
            success:
              summary: 成員詳情
              value:
                id: 00000000-0000-0000-0000-000000000001
                firebase_uid: uid_abc123xyz
                name: 王小明
                email: organizer@studio.com
                role: organizer
                assigned_property_ids:
                  - 10000000-0000-0000-0000-000000000001
                  - 10000000-0000-0000-0000-000000000002
    '401':
      description: 未認證
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            unauthorized:
              value:
                error_code: UNAUTHORIZED
                message: Unauthorized.
    '403':
      description: 權限不足
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            forbidden:
              value:
                error_code: FORBIDDEN
                message: Forbidden.
    '404':
      description: 使用者不存在
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            not_found:
              value:
                error_code: USER_NOT_FOUND
                message: User not found.
patch:
  operationId: updateUser
  summary: 更新使用者帳號（管理用途）
  tags:
    - Identity & Access
  x-required-role:
    - admin
  description: |
    - 角色調整：x-required-role: admin
    - 一般使用者更新自己的名稱：請使用 `PATCH /users/me`
    - 物業指派：請使用 `POST /users/{id}/property-assignments`
    - 重寄設定密碼信：請使用 `POST /users/{id}/password-reset`
    - BR-13：系統管理員不得降低自己的角色
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/iam/UpdateUserRequest.yaml
        examples:
          change_role:
            summary: 變更角色
            value:
              role: organizer
  responses:
    '200':
      description: 更新成功
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/iam/UserResponse.yaml
          examples:
            success:
              value:
                id: 00000000-0000-0000-0000-000000000001
                role: organizer
                updated_at: '2026-04-15T11:00:00Z'
    '401':
      description: 未認證
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            unauthorized:
              value:
                error_code: UNAUTHORIZED
                message: Unauthorized.
    '403':
      description: 權限不足
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            forbidden:
              value:
                error_code: FORBIDDEN
                message: Forbidden.
    '404':
      description: 使用者不存在
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            not_found:
              value:
                error_code: USER_NOT_FOUND
                message: User not found.
    '422':
      description: Business Rule 拒絕
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            admin_cannot_downgrade_self:
              summary: BR-13 系統管理員不得降低自己的角色
              value:
                error_code: ADMIN_CANNOT_DOWNGRADE_SELF
                message: Admin cannot downgrade own role.
