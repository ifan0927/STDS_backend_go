post:
  operationId: triggerUserPasswordReset
  summary: 重寄使用者設定密碼信
  description: |
    由系統管理員為既有使用者重新產生 Firebase password reset link，並透過既有通知流程寄送設定密碼信。

    此 API 僅供管理用途，不修改使用者角色、名稱或其他資料。
  tags:
    - Identity & Access
  x-required-role:
    - admin
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '204':
      description: 已成功寄出設定密碼信
    '401':
      description: 未認證
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            unauthorized:
              value:
                error_code: UNAUTHORIZED
                message: Unauthorized.
    '403':
      description: 權限不足
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            forbidden:
              value:
                error_code: FORBIDDEN
                message: Forbidden.
    '404':
      description: 使用者不存在
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            not_found:
              value:
                error_code: USER_NOT_FOUND
                message: User not found.
