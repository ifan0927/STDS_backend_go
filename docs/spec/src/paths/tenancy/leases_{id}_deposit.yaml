patch:
  operationId: updateLeaseDeposit
  summary: 處理押金（退還或扣款，觸發 DepositRefunded / DepositDeducted event）
  description: >
    x-required-role: admin, organizer, staff

    押金結算會更新租約押金狀態，並依處理結果觸發 DepositRefunded 或 DepositDeducted event。

    BR-10：押金扣款須填寫扣款原因。

    注意：此 endpoint 用於獨立處理押金；正常終止流程可透過 /leases/{id}/terminate
    一併處理。
  tags:
    - Leasing
  x-required-role:
    - admin
    - organizer
    - staff
  x-ownership-required: true
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/tenancy/UpdateDepositRequest.yaml
        examples:
          refund:
            summary: 退還押金
            value:
              refund_amount: 20000
          partial_settlement:
            summary: 部分扣款後退還餘額
            value:
              refund_amount: 15000
              deduction_amount: 5000
              deduction_reason: 牆壁毀損修繕費用 NT$5,000
  responses:
    '200':
      description: 押金處理成功（DepositRefunded 或 DepositDeducted event 已發出）
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/tenancy/LeaseResponse.yaml
          examples:
            settled:
              summary: 押金已結算
              value:
                id: 40000000-0000-0000-0000-000000000003
                deposit_status: settled
                deposit_refund_amount: 15000
                deposit_deduction_amount: 5000
                deposit_deduction_reason: 牆壁毀損修繕費用 NT$5,000
    '401':
      description: 未認證
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            unauthorized:
              value:
                error_code: UNAUTHORIZED
                message: Unauthorized.
    '403':
      description: 權限不足
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            forbidden:
              value:
                error_code: FORBIDDEN
                message: Forbidden.
    '404':
      description: 租約不存在
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            not_found:
              value:
                error_code: LEASE_NOT_FOUND
                message: Lease not found.
    '422':
      description: Business Rule 拒絕
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            deduction_reason_required:
              summary: BR-10 押金扣款須填寫原因
              value:
                error_code: DEPOSIT_DEDUCTION_REASON_REQUIRED
                message: 押金扣款須填寫扣款原因
