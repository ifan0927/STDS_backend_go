post:
  operationId: previewLeaseCheckoutSettlement
  summary: Preview backend-owned lease checkout settlement
  description: |
    x-required-role: admin, organizer, staff
    x-ownership-required: true

    Calculates an authoritative checkout settlement proposal without mutating business state.
    Frontend must display the returned lines, blockers, warnings, and totals instead of calculating settlement effects locally.
  tags:
    - Leasing
  x-required-role:
    - admin
    - organizer
    - staff
  x-ownership-required: true
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/tenancy/CheckoutSettlementPreviewRequest.yaml
  responses:
    '200':
      description: Checkout settlement preview.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/tenancy/CheckoutSettlementResponse.yaml
    '401':
      description: 未認證
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
    '403':
      description: 權限不足
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
    '404':
      description: 租約不存在
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
    '422':
      description: Business Rule 拒絕
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
