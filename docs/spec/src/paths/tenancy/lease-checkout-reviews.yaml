get:
  tags:
    - Tenancy
  summary: List lease checkout review rows
  operationId: listLeaseCheckoutReviews
  x-required-role:
    - admin
    - organizer
    - staff
  x-ownership-required: property
  parameters:
    - name: property_id
      in: query
      schema:
        type: string
        format: uuid
    - name: status
      in: query
      schema:
        type: string
        enum:
          - terminated
          - expired
          - force_terminated
    - name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    '200':
      description: Checkout review rows visible to the current actor.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/tenancy/LeaseCheckoutReviewListResponse.yaml
    '400':
      description: Invalid filter.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
    '401':
      description: Unauthorized.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
    '403':
      description: Forbidden.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
