get:
  operationId: listTenants
  summary: 租客列表
  tags:
    - Leasing
  x-required-role:
    - admin
    - organizer
    - staff
  x-ownership-required: true
  parameters:
    - name: property_id
      in: query
      description: 依物業篩選（跨 BC JOIN：tenants → leases → property_id）；organizer/staff 限指派物業
      schema:
        type: string
    - name: status
      in: query
      schema:
        type: string
        enum:
          - active
          - inactive
    - name: page
      in: query
      schema:
        type: integer
        default: 1
    - name: limit
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
  responses:
    '200':
      description: 租客列表
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/tenancy/TenantListResponse.yaml
          examples:
            success:
              value:
                data:
                  - id: 30000000-0000-0000-0000-000000000001
                    name: 黃小芳
                    email: huang@example.com
                    status: active
    '401':
      description: 未認證
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            unauthorized:
              value:
                error_code: UNAUTHORIZED
                message: Unauthorized.
    '403':
      description: 權限不足
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            forbidden:
              value:
                error_code: FORBIDDEN
                message: Forbidden.
post:
  operationId: createTenant
  summary: 建立租客資料
  description: 'x-required-role: admin, organizer, staff'
  tags:
    - Leasing
  x-required-role:
    - admin
    - organizer
    - staff
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/tenancy/CreateTenantRequest.yaml
        examples:
          default:
            value:
              name: 黃小芳
              email: huang@example.com
              phone: 0912-345-678
              contacts: []
  responses:
    '201':
      description: 租客建立成功
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/tenancy/TenantResponse.yaml
          examples:
            success:
              value:
                id: 30000000-0000-0000-0000-000000000001
                name: 黃小芳
                email: huang@example.com
                status: active
                created_at: '2026-04-15T10:00:00Z'
    '400':
      description: 欄位驗證錯誤
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            missing_email:
              value:
                error_code: VALIDATION_TENANT_EMAIL_REQUIRED
                message: 租客 email 為必填欄位
    '401':
      description: 未認證
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            unauthorized:
              value:
                error_code: UNAUTHORIZED
                message: Unauthorized.
    '403':
      description: 權限不足
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            forbidden:
              value:
                error_code: FORBIDDEN
                message: Forbidden.
