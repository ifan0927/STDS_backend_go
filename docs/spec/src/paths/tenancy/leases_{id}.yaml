get:
  operationId: getLease
  summary: 租約詳情（含帳單預產狀況、押金狀態）
  tags:
    - Leasing
  x-required-role:
    - admin
    - organizer
    - staff
  x-ownership-required: true
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: 租約詳情
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/tenancy/LeaseResponse.yaml
          examples:
            success:
              value:
                id: 40000000-0000-0000-0000-000000000003
                tenant_id: 30000000-0000-0000-0000-000000000001
                room_id: 20000000-0000-0000-0000-000000000002
                rent_amount: 18000
                rent_billing_cadence: monthly
                start_date: '2026-05-01'
                end_date: '2027-04-30'
                electricity_billing_cadence: monthly
                status: active
                deposit_amount: 36000
                deposit_status: held
                deposit_deduction_reason: null
    '401':
      description: 未認證
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            unauthorized:
              value:
                error_code: UNAUTHORIZED
                message: Unauthorized.
    '403':
      description: 無存取權限
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            forbidden:
              value:
                error_code: FORBIDDEN
                message: Forbidden.
    '404':
      description: 租約不存在
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            not_found:
              value:
                error_code: LEASE_NOT_FOUND
                message: Lease not found.
patch:
  operationId: updateLease
  summary: 編輯租約（租金調整，觸發 LeaseConditionChanged event）
  description: >
    x-required-role: admin, organizer（BR 限制員工不可調整租金）

    租金調整會在同一 command 中 void due_date >= nextRentPeriodStart 且
    pending_payment 的租金帳單，從下一個 rent billing period 重產新帳單，並觸發 LeaseConditionChanged event。

    BR-01、BR-02 適用。此 API 僅支援租金調整，不支援 cadence 修改；若需更動 cadence 或其他結構性條件，走 Lease replacement。
  tags:
    - Leasing
  x-required-role:
    - admin
    - organizer
  x-ownership-required: true
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/tenancy/UpdateLeaseRequest.yaml
        examples:
          adjust_rent:
            summary: 租金調整
            value:
              rent_amount: 20000
  responses:
    '200':
      description: 租約條件更新成功（LeaseConditionChanged event 已發出，帳單已 void 並重產）
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/tenancy/LeaseResponse.yaml
          examples:
            success:
              value:
                id: 40000000-0000-0000-0000-000000000003
                rent_amount: 20000
                rent_billing_cadence: monthly
                electricity_billing_cadence: monthly
                updated_at: '2026-04-15T14:00:00Z'
    '401':
      description: 未認證
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            unauthorized:
              value:
                error_code: UNAUTHORIZED
                message: Unauthorized.
    '403':
      description: 權限不足（員工不可調整租金）
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            forbidden:
              value:
                error_code: FORBIDDEN
                message: Forbidden.
    '404':
      description: 租約不存在
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            not_found:
              value:
                error_code: LEASE_NOT_FOUND
                message: Lease not found.
    '409':
      description: 樂觀鎖衝突
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            conflict:
              value:
                error_code: CONCURRENT_UPDATE_CONFLICT
                message: 資料已被其他操作更新，請重試
    '422':
      description: Business Rule 拒絕
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
          examples:
            rent_amount_non_positive:
              summary: BR-02 租金必須大於零
              value:
                error_code: LEASE_RENT_AMOUNT_NON_POSITIVE
                message: 租金必須大於零
