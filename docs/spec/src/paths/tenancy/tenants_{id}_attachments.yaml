get:
  operationId: listTenantAttachments
  summary: 租客附件列表
  tags:
    - Leasing
  x-required-role:
    - admin
    - organizer
    - staff
  description: |
    Tenant attachments follow the same property access model as other tenant
    flows. The tenant must exist and must be associated with a property the
    caller can access unless the caller is an admin.
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: 租客附件列表
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/AttachmentListResponse.yaml
    '401':
      description: 未認證
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
    '403':
      description: 租客存在，但使用者無法存取其關聯物業
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
    '404':
      description: 租客不存在
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
post:
  operationId: createTenantAttachment
  summary: 登記租客附件
  tags:
    - Leasing
  x-required-role:
    - admin
    - organizer
    - staff
  description: |
    Tenant attachments follow the same property access model as other tenant
    flows. The tenant must exist and must be associated with a property the
    caller can access unless the caller is an admin.
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/shared/RegisterAttachmentRequest.yaml
  responses:
    '201':
      description: 租客附件建立成功
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/AttachmentResponse.yaml
    '401':
      description: 未認證
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
    '403':
      description: 租客存在，但使用者無法存取其關聯物業
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
    '404':
      description: 租客不存在
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
    '422':
      description: Business Rule 拒絕
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/shared/ErrorResponse.yaml
