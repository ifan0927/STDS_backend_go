openapi: 3.0.3
info:
  title: STDS API
  version: 1.0.0
  license:
    name: Proprietary
    url: https://example.com/licenses/proprietary
  description: >
    STDS（物業代管系統）API 規格

    產出依據：docs/design/domain-model.md v3.1

    授權模型：混合型（RBAC + Resource-based）

    - x-required-role：列出可呼叫的角色（RBAC）

    - x-ownership-required：物業層級存取控制（resource-based），透過 Firebase ID token 內
    Custom Claims 的 assigned_property_ids 驗證

    - 優先順序：先驗 RBAC role，再驗 property ownership（兩者皆須通過）


    認證機制（v3.1）：系統使用 Firebase Auth 管理使用者認證。

    - 登入流程：由前端 Firebase SDK 處理，後端不接受 email/password 登入

    - 後端驗證：每個 request 以 Firebase ID token（Bearer token）呼叫後端

    - 後端 middleware 以 Firebase Admin SDK 驗證 token，從 Custom Claims 讀取 role 與
    assigned_property_ids

    - 密碼重設：由 Firebase SDK 處理，後端不提供密碼重設 API

    - users table 透過 firebase_uid 與 Firebase 帳號對應


    ## Notification 機制


    Email 通知由後端 event handler 統一處理，不提供 REST endpoint：

    - RentBillsGenerated → 寄送帳單通知給租客

    - LeaseExpiringSoon → 寄送到期提醒給 organizer/staff

    - OverdueBillReminder → 寄送催收通知（最多 3 次）

    - FinancialReportSend → 寄送財報 Email


    通知服務由後端訂閱 Domain Event 後透過 SendGrid 發送，前端無需呼叫任何 notification API。
servers:
  - url: /api/v1
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Firebase ID token。前端以 Firebase SDK 登入後取得，每個 request 帶入 Authorization
        header。

        後端以 Firebase Admin SDK 驗證，Custom Claims 包含 role 與 assigned_property_ids。
security:
  - BearerAuth: []
