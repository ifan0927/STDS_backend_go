openapi: 3.0.3
info:
  title: STDS API
  version: 1.0.1
  license:
    name: Proprietary
    url: https://example.com/licenses/proprietary
  description: >
    STDS（物業代管系統）API 規格

    產出依據：docs/design/domain-model.md v3.3

    授權模型：混合型（RBAC + Resource-based）

    - x-required-role：列出可呼叫的角色（RBAC）

    - x-ownership-required：物業層級存取控制（resource-based），透過 Firebase ID token 內
    Custom Claims 的 assigned_property_ids 驗證

    - 優先順序：先驗 RBAC role，再驗 property ownership（兩者皆須通過）


    認證機制（v3.2）：系統使用 Firebase Auth 管理使用者認證。

    - 登入流程：由前端 Firebase SDK 處理，後端不接受 email/password 登入

    - 後端驗證：每個 request 以 Firebase ID token（Bearer token）呼叫後端

    - 後端 middleware 以 Firebase Admin SDK 驗證 token，從 Custom Claims 讀取 role 與
    assigned_property_ids

    - 密碼重設：`POST /users` 建立帳號後由後端向 Firebase 產生 reset link，再透過 email 寄送；admin 可透過 `POST /users/{id}/password-reset` 重寄設定密碼信

    - users table 透過 firebase_uid 與 Firebase 帳號對應


    ## Notification 機制


    通知由後端統一處理，不提供 REST endpoint：

    - 帳單通知：帳單預產完成後的通知語意

    - 收款收據：帳單收款確認後的通知語意

    - LeaseExpiringSoon：scheduler job 寄送到期提醒給 organizer/staff

    - OverdueBillReminder：scheduler job 寄送催收通知（最多 3 次）

    - FinancialReportSend：人工審核後的 send flow


    - 通知可能由 application command、scheduler job，或明確的 send flow 觸發；不應假設所有通知都由 Domain Event subscriber 實作。direct trigger 例如 `POST /users` 建立帳號後，後端直接向 Firebase 產生 password reset link 並寄出 onboarding email

    目前正式實作 channel 為 email，使用 Resend 發送；LINE channel 只保留抽象，尚未實作。前端無需呼叫任何 notification API。
servers:
  - url: /api/v1
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Firebase ID token。前端以 Firebase SDK 登入後取得，每個 request 帶入 Authorization
        header。

        後端以 Firebase Admin SDK 驗證，Custom Claims 包含 role 與 assigned_property_ids。
    SchedulerKey:
      type: apiKey
      in: header
      name: X-Scheduler-Key
      description: >
        外部排程系統呼叫 backend job endpoint 時使用的共享密鑰。
security:
  - BearerAuth: []
