type: object
properties:
  id:
    type: string
    format: uuid
  name:
    type: string
  address:
    type: string
  subtitle:
    type: string
    nullable: true
  electricity_unit_price:
    type: number
    format: double
    minimum: 0
    exclusiveMinimum: true
    description: 台幣正數/度，可接受小數
    nullable: true
  default_electricity_billing_cadence:
    type: string
    enum:
      - monthly
      - bimonthly
  owner_id:
    type: string
    format: uuid
  contact_phone:
    type: string
    nullable: true
  contact_email:
    type: string
    format: email
    nullable: true
  notes:
    type: string
    nullable: true
  facilities:
    type: array
    items: {}
    nullable: true
  occupancy_summary:
    $ref: ./OccupancySummary.yaml
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
  version:
    type: integer
