type: object
required:
  - name
  - address
  - electricity_unit_price
  - owner_id
properties:
  name:
    type: string
  address:
    type: string
  electricity_unit_price:
    type: number
    format: double
    minimum: 0
    exclusiveMinimum: true
    description: 台幣正數/度，可接受小數（例如 4.5）
  owner_id:
    type: string
    format: uuid
