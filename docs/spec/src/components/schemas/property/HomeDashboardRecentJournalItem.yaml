type: object
required:
  - id
  - property_id
  - property_name
  - type
  - content
  - created_at
properties:
  id:
    type: string
    format: uuid
  property_id:
    type: string
    format: uuid
  property_name:
    type: string
  type:
    type: string
    enum:
      - journal_log
      - repair_request
  content:
    type: string
  created_at:
    type: string
    format: date-time
