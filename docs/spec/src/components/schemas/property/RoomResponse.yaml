type: object
properties:
  id:
    type: string
    format: uuid
  property_id:
    type: string
    format: uuid
  name:
    type: string
  status:
    type: string
    enum:
      - vacant
      - occupied
      - maintenance
  size:
    type: number
    format: double
    nullable: true
  floor:
    type: string
    nullable: true
  room_type:
    type: string
    nullable: true
  facilities:
    type: object
    additionalProperties: true
    nullable: true
  default_rent_amount:
    type: integer
    nullable: true
  notes:
    type: string
    nullable: true
  zone:
    type: string
    nullable: true
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
