type: object
properties:
  id:
    type: string
    format: uuid
  name:
    type: string
  email:
    type: string
    format: email
    nullable: true
  phone:
    type: string
    nullable: true
  contacts:
    type: array
    items:
      type: object
  birth_date:
    type: string
    format: date
    nullable: true
  national_id:
    type: string
    nullable: true
  address:
    type: string
    nullable: true
  occupation:
    type: string
    nullable: true
  status:
    type: string
    enum:
      - active
      - inactive
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
  version:
    type: integer
