type: object
properties:
  id:
    type: string
    format: uuid
  name:
    type: string
  email:
    type: string
    format: email
  phone:
    type: string
  contacts:
    type: array
    items:
      type: object
  status:
    type: string
    enum:
      - active
      - inactive
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
  version:
    type: integer
