type: object
required:
  - reason
  - deposit_handling
properties:
  reason:
    type: string
    minLength: 1
  deposit_handling:
    type: string
    description: Deposit handling decision during force termination; write_off marks the deposit as written_off, while keep_held leaves it held for later manual handling.
    enum:
      - write_off
      - keep_held
