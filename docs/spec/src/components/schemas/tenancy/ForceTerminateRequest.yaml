type: object
required:
  - termination_date
  - reason
  - deposit_handling
properties:
  termination_date:
    type: string
    format: date
    description: Force-termination effective date. The backend writes this value to lease end_date.
  actual_move_out_date:
    type: string
    format: date
    nullable: true
    description: Actual move-out or handover date. This is operational metadata only and does not affect write-off handling, deposit handling, or rent refund behavior.
  reason:
    type: string
    minLength: 1
  deposit_handling:
    type: string
    description: Deposit handling decision during force termination; write_off marks the deposit as written_off and records the full deposit amount as deposit_deduction accounting, while keep_held leaves it held for later manual handling without creating a deposit accounting entry.
    enum:
      - write_off
      - keep_held
