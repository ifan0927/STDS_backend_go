type: object
required:
  - termination_date
  - reason
  - deposit_handling
properties:
  termination_date:
    type: string
    format: date
    description: 強制終止生效日；backend 以此更新 lease end_date。
  actual_move_out_date:
    type: string
    format: date
    nullable: true
    description: 實際搬出 / 點交日；僅作為營運紀錄，不影響 write-off、deposit handling 或租金退款。
  reason:
    type: string
    minLength: 1
  deposit_handling:
    type: string
    description: Deposit handling decision during force termination; write_off marks the deposit as written_off, while keep_held leaves it held for later manual handling.
    enum:
      - write_off
      - keep_held
