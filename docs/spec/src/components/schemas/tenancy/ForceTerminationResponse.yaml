type: object
properties:
  id:
    type: string
    format: uuid
  lease_id:
    type: string
    format: uuid
  property_id:
    type: string
    format: uuid
  room_id:
    type: string
    format: uuid
  tenant_id:
    type: string
    format: uuid
  property_label:
    type: string
  room_label:
    type: string
  tenant_label:
    type: string
  status:
    type: string
    enum:
      - in_progress
      - completed
  initiated_by:
    type: string
    format: uuid
  initiated_by_label:
    type: string
  reason:
    type: string
  deposit_handling:
    type: string
    enum:
      - write_off
      - keep_held
  bills:
    type: array
    items:
      type: object
      properties:
        bill_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - pending
            - done
        type:
          type: string
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        period_label:
          type: string
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
