type: object
properties:
  id:
    type: string
    format: uuid
  tenant_id:
    type: string
    format: uuid
  room_id:
    type: string
    format: uuid
  property_id:
    type: string
    format: uuid
  property_label:
    type: string
  room_label:
    type: string
  tenant_label:
    type: string
  rent_amount:
    type: integer
  rent_billing_cadence:
    type: string
    enum:
      - monthly
      - quarterly
      - semiannual
      - annual
  start_date:
    type: string
    format: date
  end_date:
    type: string
    format: date
  electricity_billing_cadence:
    type: string
    enum:
      - monthly
      - bimonthly
  starting_meter_reading:
    type: integer
    nullable: true
    description: Move-in starting meter reading. Existing or legacy leases may be null.
  status:
    type: string
    enum:
      - active
      - expired
      - terminated
      - force_terminated
  deposit_amount:
    type: integer
  deposit_status:
    type: string
    enum:
      - held
      - settled
      - written_off
  deposit_refund_amount:
    type: integer
    nullable: true
  deposit_deduction_amount:
    type: integer
    nullable: true
  deposit_deduction_reason:
    type: string
    nullable: true
  notes:
    type: string
    nullable: true
  termination_reason:
    type: string
    nullable: true
  settlement_detail:
    type: object
    additionalProperties: true
    nullable: true
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
  version:
    type: integer
