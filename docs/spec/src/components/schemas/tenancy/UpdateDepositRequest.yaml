type: object
properties:
  refund_amount:
    type: integer
    minimum: 0
    description: 退還金額；可與 deduction_amount 併用以表達部分扣款後退餘額
  deduction_amount:
    type: integer
    minimum: 0
    description: 扣款金額；有值時須提供 deduction_reason
  deduction_reason:
    type: string
    description: deduction_amount 大於 0 時必填（BR-10）
