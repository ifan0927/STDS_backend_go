type: object
properties:
  lease_id:
    type: string
    format: uuid
  property_id:
    type: string
    format: uuid
  room_id:
    type: string
    format: uuid
  tenant_id:
    type: string
    format: uuid
  property_label:
    type: string
  room_label:
    type: string
  tenant_label:
    type: string
  start_date:
    type: string
    format: date
  end_date:
    type: string
    format: date
  lease_status:
    type: string
    enum:
      - terminated
      - expired
      - force_terminated
  deposit_status:
    type: string
    enum:
      - held
      - settled
      - written_off
  deposit_refund_amount:
    type: integer
    nullable: true
  deposit_deduction_amount:
    type: integer
    nullable: true
  termination_reason:
    type: string
    nullable: true
  checkout_finalized_at:
    type: string
    format: date-time
    nullable: true
  export_available:
    type: boolean
  force_termination_id:
    type: string
    format: uuid
    nullable: true
  force_termination_status:
    type: string
    enum:
      - in_progress
      - completed
    nullable: true
  force_termination_reason:
    type: string
    nullable: true
  force_termination_deposit_handling:
    type: string
    enum:
      - write_off
      - keep_held
    nullable: true
