type: object
required:
  - lease_id
  - property_id
  - tenant_id
  - room_id
  - property_label
  - tenant_label
  - room_label
  - checkout_date
  - reason
  - lines
  - blockers
  - warnings
  - deposit_amount
  - total_refund
  - total_charge
  - net_amount
  - net_direction
  - export_available
properties:
  lease_id:
    type: string
    format: uuid
  property_id:
    type: string
    format: uuid
  tenant_id:
    type: string
    format: uuid
  room_id:
    type: string
    format: uuid
  property_label:
    type: string
  tenant_label:
    type: string
  room_label:
    type: string
  checkout_date:
    type: string
    format: date
    description: 結算生效日 / 租約終止日，不代表實際搬出日。
  actual_move_out_date:
    type: string
    format: date
    nullable: true
    description: 實際搬出 / 點交日；僅作為營運紀錄。
  reason:
    type: string
  final_meter_reading:
    type: integer
    nullable: true
  notes:
    type: string
    nullable: true
  manual_rent_refund_amount:
    type: integer
    minimum: 0
    description: 人工決定的未到期租金退款金額；0 加 reason 表示明確不退。
  manual_rent_refund_reason:
    type: string
    nullable: true
    description: 人工租金退款決策原因。
  lines:
    type: array
    items:
      $ref: ./CheckoutSettlementLine.yaml
  blockers:
    type: array
    items:
      $ref: ./CheckoutSettlementBlocker.yaml
  warnings:
    type: array
    items:
      $ref: ./CheckoutSettlementWarning.yaml
  deposit_amount:
    type: integer
  total_refund:
    type: integer
  total_charge:
    type: integer
  net_amount:
    type: integer
    description: Absolute net amount after refund and charge lines are balanced.
  net_direction:
    type: string
    enum:
      - refund
      - payable
      - zero
  preview_token:
    type: string
    nullable: true
    description: Present only when there are no blockers and the proposal can be finalized.
  export_available:
    type: boolean
  finalized_at:
    type: string
    format: date-time
    nullable: true
