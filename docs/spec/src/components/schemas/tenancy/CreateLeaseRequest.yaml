type: object
required:
  - tenant_id
  - room_id
  - rent_amount
  - start_date
  - end_date
  - deposit_amount
properties:
  tenant_id:
    type: string
    format: uuid
  room_id:
    type: string
    format: uuid
  rent_amount:
    type: integer
  start_date:
    type: string
    format: date
  end_date:
    type: string
    format: date
  deposit_amount:
    type: integer
  electricity_billing_cadence:
    type: string
    enum:
      - monthly
      - bimonthly
    description: 可省略；若未提供則套用 Property 的 default_electricity_billing_cadence
