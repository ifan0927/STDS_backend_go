type: object
required:
  - tenant_id
  - room_id
  - rent_amount
  - start_date
  - end_date
  - deposit_amount
  - starting_meter_reading
properties:
  tenant_id:
    type: string
    format: uuid
  room_id:
    type: string
    format: uuid
  rent_amount:
    type: integer
  rent_billing_cadence:
    type: string
    enum:
      - monthly
      - quarterly
      - semiannual
      - annual
    description: 可省略；預設 monthly。rent_amount 為每個租金計費週期的金額。
  start_date:
    type: string
    format: date
  end_date:
    type: string
    format: date
  deposit_amount:
    type: integer
  electricity_billing_cadence:
    type: string
    enum:
      - monthly
      - bimonthly
    description: 可省略；若未提供則套用 Property 的 default_electricity_billing_cadence
  starting_meter_reading:
    type: integer
    minimum: 0
    description: Move-in starting meter reading. Backend uses it as the previous reading baseline for the first electricity bill in this lease.
    x-go-type: '*int'
  notes:
    type: string
    nullable: true
