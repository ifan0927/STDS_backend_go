type: object
properties:
  entry_id:
    type: string
    format: uuid
    description: Stable report-row identifier from accounting_entries or monthly_snapshot_entries.
  category:
    type: string
    enum:
      - rent_payment
      - electricity_payment
      - deposit_refund
      - deposit_deduction
      - rent_refund
      - journal_expense
  accounting_title_id:
    type: string
    format: uuid
  accounting_title_code:
    type: string
  accounting_title_name:
    type: string
  source_date:
    type: string
    format: date
  room_label:
    type: string
  tenant_label:
    type: string
  period_label:
    type: string
  display_note:
    type: string
  description:
    type: string
  amount:
    type: integer
  source:
    $ref: ./FinancialReportEntrySource.yaml
