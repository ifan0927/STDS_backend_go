type: object
required:
  - payment_method
  - paid_amount
properties:
  payment_method:
    type: string
    enum:
      - cash
      - transfer
      - other
  paid_amount:
    type: integer
    description: Payment amount. Must exactly equal the bill amount; partial or overpayments are not supported.
  paid_at:
    type: string
    format: date-time
    description: Payment timestamp. Optional; defaults to the server time.
