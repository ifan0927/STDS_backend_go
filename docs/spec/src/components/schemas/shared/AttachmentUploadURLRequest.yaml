type: object
required:
  - resource_type
  - resource_id
  - file_name
  - content_type
  - file_size
properties:
  resource_type:
    type: string
    enum:
      - property
      - room
      - tenant
      - lease
      - journal_log
      - repair_request
      - bill
  resource_id:
    type: string
    format: uuid
  file_name:
    type: string
  content_type:
    type: string
    enum:
      - image/jpeg
      - image/png
      - image/heic
      - application/pdf
  file_size:
    type: integer
    format: int64
    minimum: 1
    maximum: 20971520
    description: File size in bytes. Attachments are limited to 20MB.
