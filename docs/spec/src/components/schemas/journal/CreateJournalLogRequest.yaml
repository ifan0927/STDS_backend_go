type: object
required:
  - property_id
  - content
properties:
  property_id:
    type: string
    format: uuid
  room_id:
    type: string
    format: uuid
    nullable: true
  content:
    type: string
  expense_amount:
    type: integer
    nullable: true
  expense_description:
    type: string
    nullable: true
  expense_accounting_title_id:
    type: string
    format: uuid
    nullable: true
    description: Required by new clients when expense_amount is present. Omitted legacy requests use the default journal expense title.
